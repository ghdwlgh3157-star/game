<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111426">
<title>영혼의 결투 — game.feed</title>
<style>
:root{color-scheme:dark;--ink:#eef2ff;--muted:#abb2cc;--mint:#8df3dc;--gold:#ffe1a1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#313359,#111426 65%);color:var(--ink);font-family:Inter,"Malgun Gothic",system-ui,sans-serif}.wrap{width:min(1040px,calc(100% - 28px));margin:auto}.top{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{color:var(--ink);font-weight:850;letter-spacing:-.06em;text-decoration:none}.brand b{color:var(--mint)}.back{color:var(--muted);text-decoration:none;font-size:13px}.back:hover{color:#fff}.intro{text-align:center;padding:14px 0 18px}.eyebrow{color:var(--mint);font-size:11px;font-weight:800;letter-spacing:.18em}.intro h1{font-size:clamp(30px,6vw,48px);line-height:1.1;margin:8px 0;color:#fff1ff;letter-spacing:-.06em}.intro p{margin:0;color:var(--muted);font-size:14px}.arena{overflow:hidden;border:1px solid #67658e;border-radius:20px;background:#151a31;box-shadow:0 24px 80px #050610a8}.screen{display:block;width:100%;height:auto;touch-action:none}.help{display:flex;justify-content:center;gap:9px 18px;flex-wrap:wrap;padding:13px 10px 16px;color:#c8cce0;font-size:12px}.help kbd{display:inline-block;padding:2px 7px;margin-right:3px;border:1px solid #545975;border-radius:5px;background:#232943;color:#fff;font:700 11px ui-monospace,monospace}.touch{display:none;grid-template-columns:1fr 1.3fr 1fr;gap:8px;margin:12px 0}.touch-group{display:flex;gap:7px;justify-content:center}.touch button{min-width:48px;min-height:45px;border:1px solid #505676;border-radius:12px;background:#242944;color:#fff;font:700 14px inherit;touch-action:none}.touch button:active,.touch button.active{background:#3c5261;border-color:var(--mint)}.note{text-align:center;color:#858ca9;font-size:11px;margin:10px 0 26px}@media(max-width:700px){.touch{display:grid}.help{font-size:11px}.intro{padding-top:8px}.arena{border-radius:14px}}
</style>
</head>
<body>
<header class="wrap top"><a class="brand" href="/">game<b>.</b>feed</a><a class="back" href="/#games">← 게임 목록</a></header>
<main class="wrap">
<section class="intro"><div class="eyebrow">MINI GAME · FIGHTING</div><h1>영혼의 결투</h1><p>바람의 닌자 렌과 달빛의 검사가 맞붙는 1대1 대전. 필살기로 승부를 뒤집으세요!</p></section>
<section class="arena" aria-label="영혼의 결투 게임"><canvas id="game" class="screen" width="960" height="600" aria-label="격투 게임 화면"></canvas><div class="help"><span><kbd>A</kbd><kbd>D</kbd> 이동</span><span><kbd>W</kbd> 점프</span><span><kbd>J</kbd> 연속공격</span><span><kbd>K</kbd> 강공격</span><span><kbd>L</kbd> 필살기</span><span><kbd>S</kbd> 방어</span></div></section>
<div class="touch" aria-label="터치 조작"><div class="touch-group"><button data-hold="a" aria-label="왼쪽">◀</button><button data-hold="d" aria-label="오른쪽">▶</button><button data-tap="w" aria-label="점프">⬆</button></div><div class="touch-group"><button data-hold="s">방어</button></div><div class="touch-group"><button data-tap="j">??</button><button data-tap="k">??</button><button data-tap="l">필살</button></div></div>
<p class="note">기력 게이지가 40 이상이면 필살기를 사용할 수 있어요. 스페이스 또는 엔터로 시작하고, ESC로 처음 화면으로 돌아갑니다.</p>
</main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=960,H=600,FLOOR=475,keys=new Set(),orbs=[],sparks=[];
let frame=0,state='title',winner='';
const fresh=(name,x,color,accent,cpu=false)=>({name,x,y:FLOOR,vy:0,color,accent,cpu,facing:cpu?-1:1,hp:100,energy:0,attack:'',attackTime:0,cooldown:0,stun:0,flash:0,walk:0,blocking:false,landed:false});
let p=fresh('렌 · 바람의 닌자',250,'#248c91','#8df3dc'),e=fresh('세라 · 달빛의 검사',710,'#5644a2','#e6b8ff',true);
function start(){p=fresh('렌 · 바람의 닌자',250,'#248c91','#8df3dc');e=fresh('세라 · 달빛의 검사',710,'#5644a2','#e6b8ff',true);orbs.length=0;sparks.length=0;winner='';state='fight'}
function press(k){if(k===' '||k==='enter'){if(state!=='fight')start();return}if(k==='escape'){state='title';return}if(!keys.has(k)){keys.add(k);if(state==='fight'){if(k==='j')attack(p,'light');if(k==='k')attack(p,'heavy');if(k==='l')attack(p,'special')}}}
addEventListener('keydown',ev=>{let k=ev.key.toLowerCase();if([' ','arrowleft','arrowright','arrowup'].includes(k))ev.preventDefault();press(k)});addEventListener('keyup',ev=>keys.delete(ev.key.toLowerCase()));
document.querySelectorAll('[data-hold],[data-tap]').forEach(b=>{const k=b.dataset.hold||b.dataset.tap;const down=ev=>{ev.preventDefault();if(b.dataset.hold){keys.add(k);b.classList.add('active')}else if(k==='w'){if(p.y>=FLOOR-1&&state==='fight')p.vy=-13.5}else press(k)};const up=()=>{keys.delete(k);b.classList.remove('active')};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=1.2+Math.random()*4;sparks.push([x,y,Math.cos(a)*s,Math.sin(a)*s,14+Math.random()*12,color])}}
function attack(f,type){if(f.cooldown||f.stun||f.attack)return;if(type==='special'){if(f.energy<40)return;f.energy-=40;f.attack=type;f.attackTime=32;f.cooldown=44;orbs.push({x:f.x+f.facing*37,y:f.y-86,vx:f.facing*8,owner:f,color:f.accent,life:90});burst(f.x,f.y-82,f.accent,10)}else{f.attack=type;f.attackTime=type==='heavy'?20:13;f.cooldown=type==='heavy'?30:17;f.landed=false}}
function hit(a,d,amount,push){let blocked=d.blocking&&d.facing===-a.facing,damage=blocked?Math.max(2,Math.floor(amount/4)):amount;d.hp=Math.max(0,d.hp-damage);d.energy=Math.min(100,d.energy+(blocked?5:12));a.energy=Math.min(100,a.energy+(blocked?4:8));d.flash=5;if(!blocked){d.stun=13;d.x+=a.facing*push}burst(d.x,d.y-85,blocked?'#fff2a1':'#ffb0d8',7)}
function updateF(f,o){if(f.cooldown)f.cooldown--;if(f.attackTime&&!--f.attackTime){f.attack='';f.landed=false}if(f.stun)f.stun--;if(f.flash)f.flash--;f.facing=o.x>f.x?1:-1;f.vy+=.72;f.y+=f.vy;if(f.y>=FLOOR){f.y=FLOOR;f.vy=0}if(f.cpu){let d=Math.abs(o.x-f.x);f.blocking=false;if(!f.stun&&!f.attack){if(d>158)f.x+=f.facing*2.2;else if(d<88&&Math.random()<.035)f.blocking=true;if(d<128&&Math.random()<.045)attack(f,Math.random()<.35?'heavy':'light');else if(d>205&&f.energy>=40&&Math.random()<.018)attack(f,'special');else if(d<180&&f.y>=FLOOR&&Math.random()<.004)f.vy=-12}}else{f.blocking=keys.has('s');if(!f.stun&&!f.attack){if(keys.has('a')||keys.has('arrowleft')){f.x-=4.2;f.walk+=.24}if(keys.has('d')||keys.has('arrowright')){f.x+=4.2;f.walk+=.24}if((keys.has('w')||keys.has('arrowup'))&&f.y>=FLOOR)f.vy=-13.5}}f.x=Math.max(48,Math.min(W-48,f.x))}
function punch(a,d){if(!a.attack||a.attack==='special'||a.landed)return;let active=5<=a.attackTime&&a.attackTime<=(a.attack==='heavy'?11:8),dx=d.x-a.x,reach=a.attack==='heavy'?116:88;if(active&&Math.abs(dx)<reach&&Math.abs(d.y-a.y)<85&&dx*a.facing>0){a.landed=true;hit(a,d,a.attack==='heavy'?16:9,a.attack==='heavy'?8:5)}}
function tick(){frame++;if(state==='fight'){updateF(p,e);updateF(e,p);punch(p,e);punch(e,p);for(let i=orbs.length-1;i>=0;i--){let o=orbs[i],d=o.owner===p?e:p;o.x+=o.vx;o.life--;if(Math.abs(o.x-d.x)<38&&Math.abs(o.y-(d.y-84))<54){hit(o.owner,d,22,12);burst(o.x,o.y,o.color,16);orbs.splice(i,1)}else if(o.life<=0||o.x<0||o.x>W)orbs.splice(i,1)}for(let i=sparks.length-1;i>=0;i--){let q=sparks[i];q[0]+=q[2];q[1]+=q[3];q[2]*=.96;q[3]=q[3]*.96+.08;q[4]--;if(q[4]<=0)sparks.splice(i,1)}if(p.hp<=0||e.hp<=0){state='over';winner=e.hp<=0?p.name:e.name}}draw();requestAnimationFrame(tick)}
function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#151b32');g.addColorStop(1,'#242b40');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#e7d9ff';ctx.beginPath();ctx.arc(760,116,68,0,7);ctx.fill();ctx.fillStyle='#151b32';ctx.beginPath();ctx.arc(787,91,62,0,7);ctx.fill();ctx.fillStyle='#293354';ctx.beginPath();ctx.moveTo(0,405);ctx.lineTo(150,265);ctx.lineTo(305,405);ctx.lineTo(430,300);ctx.lineTo(610,415);ctx.lineTo(785,280);ctx.lineTo(960,408);ctx.lineTo(960,500);ctx.lineTo(0,500);ctx.fill();ctx.fillStyle='#8e3e58';ctx.fillRect(76,242,15,166);ctx.fillRect(204,242,15,166);ctx.fillStyle='#b85b68';ctx.fillRect(56,235,183,17);ctx.fillRect(69,214,158,15);ctx.fillStyle='#252b3e';ctx.fillRect(0,FLOOR,W,H-FLOOR);ctx.fillStyle='#69718b';ctx.fillRect(0,FLOOR,W,4);ctx.strokeStyle='#30374d';ctx.lineWidth=2;for(let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,FLOOR+16);ctx.lineTo(x+38,H);ctx.stroke()}for(const [x,y]of[[280,280],[650,315],[865,250]]){ctx.fillStyle='#ffc778';ctx.beginPath();ctx.ellipse(x,y,8,16,0,0,7);ctx.fill();ctx.strokeStyle='#ffc778';ctx.beginPath();ctx.ellipse(x,y,20,28,0,0,7);ctx.stroke()}}
function bar(x,y,w,v,color,reverse=false){ctx.fillStyle='#302f48';ctx.fillRect(x,y,w,17);ctx.fillStyle=color;let a=w*v/100;ctx.fillRect(reverse?x+w-a:x,y,a,17);ctx.strokeStyle='#e6d9ff';ctx.lineWidth=2;ctx.strokeRect(x,y,w,17)}
function fighter(f){let x=f.x,y=f.y,bob=Math.sin(frame*.14+x)*2,cy=y-77+bob,d=f.facing,body=f.flash?'#fff2e6':f.color;ctx.fillStyle='#111524';ctx.beginPath();ctx.ellipse(x,y-2,32,6,0,0,7);ctx.fill();ctx.lineCap='round';ctx.strokeStyle='#20233b';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(x-5,y-45);ctx.lineTo(x-8,y-5);ctx.moveTo(x+5,y-45);ctx.lineTo(x+8,y-5);ctx.stroke();ctx.strokeStyle=f.accent;ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(x-8,y-5);ctx.lineTo(x,y-3);ctx.moveTo(x+8,y-5);ctx.lineTo(x+16,y-3);ctx.stroke();ctx.fillStyle=f.accent;ctx.beginPath();ctx.moveTo(x-d*7,cy-25);ctx.lineTo(x-d*42,cy+8);ctx.lineTo(x-d*22,y-39);ctx.fill();ctx.fillStyle=body;ctx.strokeStyle='#101322';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-18,cy-26);ctx.lineTo(x+18,cy-26);ctx.lineTo(x+14,y-39);ctx.lineTo(x-14,y-39);ctx.closePath();ctx.fill();ctx.stroke();ctx.lineWidth=13;ctx.strokeStyle=body;ctx.beginPath();if(f.attack){let hx=x+d*(f.attack==='heavy'?62:50),hy=cy-(f.attack==='heavy'?5:10);ctx.moveTo(x+d*10,cy-15);ctx.lineTo(hx,hy);ctx.stroke();ctx.fillStyle=f.accent;ctx.beginPath();ctx.arc(hx,hy,8,0,7);ctx.fill();if(f.attack==='heavy'){ctx.strokeStyle='#eff4ff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx+d*35,hy-18);ctx.stroke()}}else{ctx.moveTo(x-d*12,cy-13);ctx.lineTo(x-d*24,cy+2);ctx.moveTo(x+d*12,cy-13);ctx.lineTo(x+d*25,cy+2);ctx.stroke()}ctx.fillStyle='#edc1a7';ctx.strokeStyle='#101322';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,cy-39,15,15,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle=f.color;ctx.beginPath();ctx.moveTo(x-16,cy-43);ctx.lineTo(x-14,cy-58);ctx.lineTo(x,cy-68);ctx.lineTo(x+16,cy-55);ctx.lineTo(x+18,cy-40);ctx.lineTo(x+5,cy-49);ctx.lineTo(x-2,cy-40);ctx.fill();ctx.fillStyle='#172031';ctx.fillRect(x+d*5-2,cy-43,6,2);ctx.fillStyle=f.cpu?'#d3c1ff':'#d7eff1';ctx.fillRect(x-12,cy-57,24,4);if(f.blocking){ctx.strokeStyle='#ffe27d';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,cy-27,39,42,0,0,7);ctx.stroke()}}
function draw(){bg();bar(36,31,365,p.hp,'#49d6a9');bar(W-401,31,365,e.hp,'#e77bc7',true);bar(38,55,185,p.energy,'#70cfff');bar(W-223,55,185,e.energy,'#c8a0ff',true);ctx.textBaseline='middle';ctx.fillStyle='#eef8ff';ctx.font='bold 13px Malgun Gothic, sans-serif';ctx.textAlign='left';ctx.fillText(p.name,38,18);ctx.textAlign='right';ctx.fillText(e.name,W-38,18);ctx.textAlign='center';ctx.fillStyle='#ffe5b0';ctx.font='bold 17px Georgia,serif';ctx.fillText('SOUL DUEL',W/2,43);for(const o of orbs){ctx.fillStyle=o.color;ctx.beginPath();ctx.arc(o.x,o.y,20,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(o.x,o.y,29,0,7);ctx.stroke()}for(const q of sparks){ctx.fillStyle=q[5];ctx.fillRect(q[0]-3,q[1]-3,6,6)}fighter(p);fighter(e);ctx.fillStyle='#c6cbe0';ctx.font='11px Malgun Gothic,sans-serif';ctx.fillText('A / D 이동   W 점프   J 연속공격   K 강공격   L 필살기(기력 40)   S 방어',W/2,555);if(state==='title'||state==='over'){ctx.fillStyle='#0c1020aa';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle=state==='title'?'#f3e4ff':'#ffd995';ctx.font='bold 42px Malgun Gothic,sans-serif';ctx.fillText(state==='title'?'영혼의 결투':'승리',W/2,218);ctx.fillStyle='#ffe0a5';ctx.font='bold 19px Georgia,serif';ctx.fillText(state==='title'?'SOUL DUEL':winner,W/2,273);ctx.fillStyle='#88f0d7';ctx.font='bold 15px Malgun Gothic,sans-serif';ctx.fillText(state==='title'?'스페이스 또는 엔터를 눌러 시작':'엔터를 눌러 다시 도전',W/2,354);if(state==='title'){ctx.fillStyle='#dae2ff';ctx.font='17px Malgun Gothic,sans-serif';ctx.fillText('바람의 닌자 렌  VS  달빛의 검사 세라',W/2,316)}}}
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
